<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="library-container">
        <h1>Library Management System</h1>

        <div class="search-box">
            <input type="text" placeholder="Search books...">
            <button>Search</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>001</td>
                    <td>HTML Basics</td>
                    <td>John Doe</td>
                    <td class="available">Available</td>
                </tr>
                <tr>
                    <td>002</td>
                    <td>CSS Mastery</td>
                    <td>Jane Smith</td>
                    <td class="issued">Issued</td>
                </tr>
                <tr>
                    <td>003</td>
                    <td>Web Design</td>
                    <td>Alex Brown</td>
                    <td class="available">Available</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
